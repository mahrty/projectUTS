<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pencarian - Jurusan Teknik Komputer dan Informatika</title>
    <link rel="icon" href="../pict/logo.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Tandai JS aktif SEBELUM render: elemen .reveal hanya disembunyikan kalau JS jalan -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <!-- Style khusus halaman pencarian (selebihnya dari css/style.css) -->
    <style>
      .search-box {
        background: #fff;
        border: 1px solid #adb5bd;
        border-radius: 50px;
        padding: 7px 14px;
      }
      .search-box input {
        border: 0;
        outline: 0;
        box-shadow: none !important;
      }
      .search-box input::-webkit-search-cancel-button {
        display: none;
      }
      .result-card {
        background: #fff;
        border: 0;
        border-radius: 16px;
        transition:
          transform 0.3s var(--ease-out),
          box-shadow 0.3s var(--ease-out);
      }
      .result-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.75rem 1.5rem rgba(8, 61, 98, 0.12) !important;
      }
      .result-title {
        color: #0b5c91;
        text-decoration: none;
        font-weight: 700;
      }
      .result-title:hover {
        color: #0191d8;
      }
      .result-url {
        color: #198754;
        font-size: 0.875rem;
      }
      .highlight {
        background: #fff0a8;
        padding: 0 2px;
        border-radius: 3px;
        font-weight: 600;
      }
    </style>
  </head>
  <body data-page="pencarian">
    <div id="site-header"></div>

    <main class="py-5 my-lg-4">
      <div class="container">
        <div class="text-center mb-4 reveal">
          <h1 class="fw-bold">Pencarian</h1>
          <p class="text-secondary">
            Cari informasi pada website Jurusan Teknik Komputer dan Informatika.
          </p>
        </div>
        <form
          id="searchForm"
          role="search"
          class="search-box d-flex align-items-center gap-2 mx-auto mb-4"
          style="max-width: 760px"
        >
          <i class="bi bi-search fs-5"></i
          ><input
            id="searchInput"
            name="q"
            type="search"
            class="form-control"
            placeholder="Masukkan kata kunci..."
            autocomplete="off"
            aria-label="Kata kunci"
            required
          /><button type="submit" class="btn btn-primary rounded-pill px-4">
            Cari
          </button>
        </form>
        <div id="searchInfo" class="mb-3" aria-live="polite"></div>
        <div id="results"></div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js" data-base="../"></script>
    <script src="../js/main.js"></script>
    <script>
      var pages = [
        ["Beranda", "../index.html"],
        ["Tentang Kami", "tentang-kami.html"],
        ["Program Studi", "program-studi.html"],
        ["Akademik", "akademik.html"],
        ["Penelitian", "penelitian.html"],
        ["Pengabdian", "pengabdian.html"],
        ["Berita", "berita.html"],
        ["Kontak", "kontak.html"],
      ].map(function (p) {
        return { title: p[0], url: p[1] };
      });
      var form = document.getElementById("searchForm"),
        input = document.getElementById("searchInput"),
        resultsBox = document.getElementById("results"),
        infoBox = document.getElementById("searchInfo");
      var cache = null,
        runId = 0;
      function esc(t) {
        return t
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
      function rx(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }
      function highlight(text, words) {
        var re = new RegExp(
          "(" +
            words
              .map(function (w) {
                return rx(esc(w));
              })
              .join("|") +
            ")",
          "gi",
        );
        return esc(text).replace(re, '<span class="highlight">$1</span>');
      }
      function snippet(text, words) {
        var lower = text.toLowerCase(),
          idx = -1,
          len = 0;
        words.forEach(function (w) {
          var i = lower.indexOf(w);
          if (i !== -1 && (idx === -1 || i < idx)) {
            idx = i;
            len = w.length;
          }
        });
        if (idx === -1) return esc(text.slice(0, 220));
        var s = Math.max(0, idx - 100),
          e = Math.min(text.length, idx + len + 140),
          t = text.slice(s, e);
        return (
          (s > 0 ? "..." : "") +
          highlight(t, words) +
          (e < text.length ? "..." : "")
        );
      }
      function getPage(p) {
        return fetch(p.url)
          .then(function (r) {
            if (!r.ok) return null;
            return r.text();
          })
          .then(function (h) {
            if (!h) return null;
            var d = new DOMParser().parseFromString(h, "text/html");
            d.querySelectorAll(
              "script,style,noscript,#site-header,#site-footer,.carousel-indicators",
            ).forEach(function (x) {
              x.remove();
            });
            var t = ((d.querySelector("main") || d.body).textContent || "")
              .replace(/\s+/g, " ")
              .trim();
            return {
              url: p.url,
              title: (d.querySelector("title") || {}).textContent
                ? d.querySelector("title").textContent.trim()
                : p.title,
              text: t,
            };
          })
          .catch(function () {
            return null;
          });
      }
      function load() {
        return (
          cache ||
          (cache = Promise.all(pages.map(getPage)).then(function (a) {
            return a.filter(Boolean);
          }))
        );
      }
      function box(icon, h, p) {
        return (
          '<div class="card border-0 shadow-sm rounded-4"><div class="card-body text-center py-5"><i class="bi bi-' +
          icon +
          ' fs-1 text-secondary"></i><h2 class="h5 fw-bold mt-3">' +
          h +
          '</h2><p class="text-secondary mb-0">' +
          p +
          "</p></div></div>"
        );
      }
      function searchSite(query) {
        var id = ++runId;
        resultsBox.innerHTML =
          '<div class="text-center py-5"><div class="spinner-border text-primary mb-3"></div><p class="text-secondary">Sedang mencari...</p></div>';
        infoBox.innerHTML = "";
        load().then(function (loaded) {
          if (id !== runId) return;
          if (!loaded.length) {
            cache = null;
            resultsBox.innerHTML = box(
              "exclamation-triangle",
              "Halaman tidak dapat dibaca",
              "Pencarian perlu dijalankan lewat web server (bukan dibuka langsung sebagai file), dan file halaman harus tersedia.",
            );
            return;
          }
          var words = query.toLowerCase().split(/\s+/).filter(Boolean);
          var m = loaded
            .map(function (p) {
              var t = p.text.toLowerCase(),
                ti = p.title.toLowerCase();
              if (
                !words.every(function (w) {
                  return t.indexOf(w) !== -1 || ti.indexOf(w) !== -1;
                })
              )
                return null;
              var s = 0;
              words.forEach(function (w) {
                if (ti.indexOf(w) !== -1) s += 10;
                s += t.split(w).length - 1;
              });
              return { p: p, s: s };
            })
            .filter(Boolean)
            .sort(function (a, b) {
              return b.s - a.s;
            });
          infoBox.innerHTML =
            '<div class="d-flex justify-content-between align-items-center"><span>Hasil pencarian untuk <strong>"' +
            esc(query) +
            '"</strong></span><span class="badge text-bg-primary rounded-pill">' +
            m.length +
            " hasil</span></div>";
          if (!m.length) {
            resultsBox.innerHTML = box(
              "search",
              "Tidak ada hasil",
              "Coba gunakan kata kunci lain.",
            );
            return;
          }
          resultsBox.innerHTML = m
            .map(function (x) {
              return (
                '<div class="card result-card shadow-sm mb-3"><div class="card-body p-4"><a class="result-title h5 d-block mb-2" href="' +
                x.p.url +
                '">' +
                esc(x.p.title) +
                '</a><div class="result-url mb-2">' +
                esc(x.p.url) +
                '</div><p class="text-secondary mb-0">' +
                snippet(x.p.text, words) +
                "</p></div></div>"
              );
            })
            .join("");
        });
      }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var q = input.value.trim();
        if (!q) return;
        var u = new URL(location.href);
        u.searchParams.set("q", q);
        history.replaceState({}, "", u);
        searchSite(q);
      });
      var iq = new URLSearchParams(location.search).get("q");
      if (iq) {
        input.value = iq;
        searchSite(iq);
      } else
        resultsBox.innerHTML = box(
          "search",
          "Mulai pencarian",
          "Masukkan kata kunci pada kotak pencarian di atas.",
        );
    </script>
  </body>
</html>
